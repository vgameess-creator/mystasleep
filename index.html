<script>
    // הקישור המעודכן שלך:
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyCJTGreh3VgzCwIUhOW4N9zD01YTM82B9LggnQCwggGk8KZCIDhHlcU4P3a8CfbMJD/exec';
    const ADMIN_PIN = '121221';

    const STORAGE_KEYS = {
      fullName: 'sleep_v4_fullName',
      roomNumber: 'sleep_v4_roomNumber',
      housingType: 'sleep_v4_housingType',
      currentStatus: 'sleep_v4_currentStatus',
      adminLoggedIn: 'sleep_v4_adminLoggedIn',
      lastReportDate: 'sleep_v4_lastReportDate'
    };

    const adminState = {
      todayData: [],
      historyDays: [],
      activeTab: 'today'
    };

    const els = {
      fullName: document.getElementById('fullName'),
      roomNumber: document.getElementById('roomNumber'),
      housingType: document.getElementById('housingType'),
      currentStatusText: document.getElementById('currentStatusText'),
      toggleBtn: document.getElementById('toggleBtn'),
      saveDetailsBtn: document.getElementById('saveDetailsBtn'),
      resetDetailsBtn: document.getElementById('resetDetailsBtn'),
      userMessage: document.getElementById('userMessage'),

      openAdminLogin: document.getElementById('openAdminLogin'),
      userCard: document.getElementById('userCard'),
      adminLoginCard: document.getElementById('adminLoginCard'),
      adminPanelCard: document.getElementById('adminPanelCard'),

      adminPin: document.getElementById('adminPin'),
      adminLoginBtn: document.getElementById('adminLoginBtn'),
      adminLoginMessage: document.getElementById('adminLoginMessage'),

      adminPanelMessage: document.getElementById('adminPanelMessage'),
      refreshAdminBtn: document.getElementById('refreshAdminBtn'),
      copyTodayBtn: document.getElementById('copyTodayBtn'),

      tabTodayBtn: document.getElementById('tabTodayBtn'),
      tabHistoryBtn: document.getElementById('tabHistoryBtn'),
      todayPanel: document.getElementById('todayPanel'),
      historyPanel: document.getElementById('historyPanel'),

      adminSearchInput: document.getElementById('adminSearchInput'),
      housingFilter: document.getElementById('housingFilter'),

      totalSleepingCount: document.getElementById('totalSleepingCount'),
      countHayalim: document.getElementById('countHayalim'),
      countHavalot: document.getElementById('countHavalot'),
      countKtzinot: document.getElementById('countKtzinot'),
      countKtzinim: document.getElementById('countKtzinim'),

      backToUser: document.getElementById('backToUser'),
      logoutAdmin: document.getElementById('logoutAdmin'),
      toast: document.getElementById('toast')
    };

    function showMessage(element, text, type = 'success') {
      element.textContent = text;
      element.className = `message show ${type}`;
    }

    function clearMessage(element) {
      element.textContent = '';
      element.className = 'message';
    }

    let toastTimer = null;

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.remove('show');
      }, 2200);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function saveLocalDetails() {
      localStorage.setItem(STORAGE_KEYS.fullName, els.fullName.value.trim());
      localStorage.setItem(STORAGE_KEYS.roomNumber, els.roomNumber.value.trim());
      localStorage.setItem(STORAGE_KEYS.housingType, els.housingType.value);
    }

    function loadLocalDetails() {
      els.fullName.value = localStorage.getItem(STORAGE_KEYS.fullName) || '';
      els.roomNumber.value = localStorage.getItem(STORAGE_KEYS.roomNumber) || '';
      els.housingType.value = localStorage.getItem(STORAGE_KEYS.housingType) || '';
    }

    function resetLocalDetails() {
      localStorage.removeItem(STORAGE_KEYS.fullName);
      localStorage.removeItem(STORAGE_KEYS.roomNumber);
      localStorage.removeItem(STORAGE_KEYS.housingType);
      localStorage.removeItem(STORAGE_KEYS.currentStatus);
      localStorage.removeItem(STORAGE_KEYS.lastReportDate);

      els.fullName.value = '';
      els.roomNumber.value = '';
      els.housingType.value = '';
      setCurrentStatus('לא ישן');
      updateToggleUI();
    }

    function checkDailyReset() {
      const savedDate = localStorage.getItem(STORAGE_KEYS.lastReportDate);
      const today = new Date().toDateString();
      
      if (savedDate && savedDate !== today) {
        localStorage.removeItem(STORAGE_KEYS.currentStatus);
        localStorage.setItem(STORAGE_KEYS.lastReportDate, today);
        setCurrentStatus('לא ישן');
      }
    }

    function getCurrentStatus() {
      return localStorage.getItem(STORAGE_KEYS.currentStatus) || 'לא ישן';
    }

    function setCurrentStatus(status) {
      localStorage.setItem(STORAGE_KEYS.currentStatus, status);
    }

    function setAdminSession(isLoggedIn) {
      localStorage.setItem(STORAGE_KEYS.adminLoggedIn, isLoggedIn ? '1' : '0');
    }

    function isAdminSession() {
      return localStorage.getItem(STORAGE_KEYS.adminLoggedIn) === '1';
    }

    function validateDetails(showErrors = true) {
      const fullName = els.fullName.value.trim();
      const roomNumber = els.roomNumber.value.trim();
      const housingType = els.housingType.value;

      if (!fullName) {
        if (showErrors) {
          showMessage(els.userMessage, 'יש להזין שם מלא.', 'error');
          els.fullName.focus();
        }
        return null;
      }

      if (!roomNumber) {
        if (showErrors) {
          showMessage(els.userMessage, 'יש להזין מספר חדר.', 'error');
          els.roomNumber.focus();
        }
        return null;
      }

      if (!housingType) {
        if (showErrors) {
          showMessage(els.userMessage, 'יש לבחור סוג מגורים.', 'error');
          els.housingType.focus();
        }
        return null;
      }

      return { fullName, roomNumber, housingType };
    }

    // --- בדיקה מעודכנת עבור שעה 08:30 ---
    function isReportingTimeOpen() {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      
      // פתוח החל מ-5:00 בבוקר ועד שעה 8:29 ו-59 שניות כולל (נסגר ב-8:30 בדיוק)
      return currentHour >= 5 && (currentHour < 8 || (currentHour === 8 && currentMinute < 30));
    }

    function updateToggleUI() {
      checkDailyReset();

      const status = getCurrentStatus();
      const isSleeping = status === 'ישן';
      const isOpen = isReportingTimeOpen();

      els.currentStatusText.textContent = status;
      els.toggleBtn.classList.remove('state-awake', 'state-sleeping');

      if (!isOpen) {
        els.toggleBtn.textContent = 'המערכת סגורה לדיווח (פתוח 05:00-08:30)';
        els.toggleBtn.disabled = true;
        els.toggleBtn.style.background = '#555';
        els.toggleBtn.style.cursor = 'not-allowed';
        els.toggleBtn.style.opacity = '0.7';
      } else {
        els.toggleBtn.disabled = false;
        els.toggleBtn.style.background = ''; 
        els.toggleBtn.style.cursor = 'pointer';
        els.toggleBtn.style.opacity = '1';

        if (isSleeping) {
          els.toggleBtn.textContent = '🔄 התחרטתי בסוף לא ישן';
          els.toggleBtn.classList.add('state-sleeping');
        } else {
          els.toggleBtn.textContent = '🌙 סמן אותי כישן היום';
          els.toggleBtn.classList.add('state-awake');
        }
      }
    }

    async function syncUserStatusFromServer() {
      const details = validateDetails(false);
      if (!details) return;

      try {
        const params = new URLSearchParams({
          action: 'userLatest',
          fullName: details.fullName,
          roomNumber: details.roomNumber,
          housingType: details.housingType
        });

        const response = await fetch(`${scriptURL}?${params.toString()}`);
        const result = await response.json();

        if (result.success) {
          setCurrentStatus(result.status || 'ער');
          localStorage.setItem(STORAGE_KEYS.lastReportDate, new Date().toDateString());
          updateToggleUI();
        }
      } catch (error) {
      }
    }

    async function saveStatus(status) {
      const details = validateDetails(true);
      if (!details) return;

      clearMessage(els.userMessage);
      saveLocalDetails();
      els.toggleBtn.disabled = true;

      try {
        const response = await fetch(scriptURL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'saveStatus',
            fullName: details.fullName,
            roomNumber: details.roomNumber,
            housingType: details.housingType,
            status
          })
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || 'שמירת הדיווח נכשלה.');
        }

        setCurrentStatus(status);
        localStorage.setItem(STORAGE_KEYS.lastReportDate, new Date().toDateString());
        updateToggleUI();

        showMessage(els.userMessage, 'דווח בהצלחה', 'success');
        showToast('דווח בהצלחה');
      } catch (error) {
        showMessage(els.userMessage, error.message || 'אירעה שגיאה בשליחת הדיווח.', 'error');
        els.toggleBtn.disabled = false;
      }
    }

    async function handleToggle() {
      if (!isReportingTimeOpen()) return;
      const current = getCurrentStatus();
      const next = current === 'ישן' ? 'ער' : 'ישן';
      await saveStatus(next);
    }

    function saveOnlyDetails() {
      const details = validateDetails(true);
      if (!details) return;

      saveLocalDetails();
      showMessage(els.userMessage, 'הפרטים נשמרו בהצלחה', 'success');
      showToast('הפרטים נשמרו');
      syncUserStatusFromServer();
    }

    function handleResetDetails() {
      resetLocalDetails();
      clearMessage(els.userMessage);
      showMessage(els.userMessage, 'הפרטים אופסו בהצלחה', 'success');
      showToast('הפרטים אופסו');
    }

    function showUserScreen() {
      els.userCard.classList.remove('hidden');
      els.adminLoginCard.classList.add('hidden');
      els.adminPanelCard.classList.add('hidden');
    }

    function showAdminLoginScreen() {
      els.userCard.classList.add('hidden');
      els.adminLoginCard.classList.remove('hidden');
      els.adminPanelCard.classList.add('hidden');
      clearMessage(els.adminLoginMessage);
      els.adminPin.value = '';
      setTimeout(() => els.adminPin.focus(), 50);
    }

    function showAdminPanelScreen() {
      els.userCard.classList.add('hidden');
      els.adminLoginCard.classList.add('hidden');
      els.adminPanelCard.classList.remove('hidden');
      setActiveAdminTab('today');
      loadAdminData();
    }

    function setActiveAdminTab(tabName) {
      adminState.activeTab = tabName;
      const isToday = tabName === 'today';

      els.tabTodayBtn.classList.toggle('active', isToday);
      els.tabHistoryBtn.classList.toggle('active', !isToday);

      els.todayPanel.classList.toggle('hidden', !isToday);
      els.historyPanel.classList.toggle('hidden', isToday);
    }

    function handleAdminLogin() {
      clearMessage(els.adminLoginMessage);
      const pin = els.adminPin.value.trim();

      if (pin !== ADMIN_PIN) {
        showMessage(els.adminLoginMessage, 'קוד הגישה שגוי.', 'error');
        return;
      }

      setAdminSession(true);
      showAdminPanelScreen();
    }

    function getAdminFilters() {
      return {
        search: els.adminSearchInput.value.trim().toLowerCase(),
        housingType: els.housingFilter.value
      };
    }

    function applyFilters(records) {
      const filters = getAdminFilters();

      return records.filter(item => {
        const matchesHousing = !filters.housingType || item.housingType === filters.housingType;

        const haystack = [
          item.fullName,
          item.roomNumber,
          item.housingType,
          item.status
        ].join(' ').toLowerCase();

        const matchesSearch = !filters.search || haystack.includes(filters.search);

        return matchesHousing && matchesSearch;
      });
    }

    function updateSummary(records) {
      const sleeping = records.filter(item => item.status === 'ישן');

      const counts = {
        total: sleeping.length,
        'חיילים': sleeping.filter(x => x.housingType === 'חיילים').length,
        'חיילות': sleeping.filter(x => x.housingType === 'חיילות').length,
        'קצינות': sleeping.filter(x => x.housingType === 'קצינות').length,
        'קצינים': sleeping.filter(x => x.housingType === 'קצינים').length
      };

      els.totalSleepingCount.textContent = counts.total;
      els.countHayalim.textContent = counts['חיילים'];
      els.countHavalot.textContent = counts['חיילות'];
      els.countKtzinot.textContent = counts['קצינות'];
      els.countKtzinim.textContent = counts['קצינים'];
    }

    function renderTodayPanel(records) {
      const filtered = applyFilters(records);
      updateSummary(filtered);

      const sleepingOnly = filtered.filter(item => item.status === 'ישן');

      if (!sleepingOnly.length) {
        els.todayPanel.innerHTML = `
          <div class="day-card empty-state">
            אין כרגע תוצאות תואמות לחיפוש או לפילטר.
          </div>
        `;
        return;
      }

      els.todayPanel.innerHTML = `
        <div class="day-card">
          <strong>ישנים היום: ${sleepingOnly.length}</strong>
          <div class="list">
            ${sleepingOnly.map(item => `
              <div class="record-card">
                <strong>${escapeHtml(item.fullName)}</strong>
                <span class="badge sleeping">ישן</span>
                <div class="record-meta">
                  חדר ${escapeHtml(item.roomNumber)} | ${escapeHtml(item.housingType)} | ${escapeHtml(item.time)}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderHistoryPanel(days) {
      const filters = getAdminFilters();

      const html = days.map(day => {
        const filteredRecords = day.records.filter(item => {
          const matchesHousing = !filters.housingType || item.housingType === filters.housingType;
          const haystack = [item.fullName, item.roomNumber, item.housingType, item.status].join(' ').toLowerCase();
          const matchesSearch = !filters.search || haystack.includes(filters.search);
          return matchesHousing && matchesSearch;
        });

        const sleepingCount = filteredRecords.filter(item => item.status === 'ישן').length;

        return `
          <div class="day-card">
            <strong>${escapeHtml(day.date)}</strong>
            <div class="record-meta" style="margin-top:6px;">
              תוצאות: ${filteredRecords.length} | ישנים: ${sleepingCount}
            </div>

            <div class="toolbar">
              <button class="ghost-btn copy-by-date-btn" data-date="${escapeHtml(day.date)}" type="button">📋 העתק ישנים של יום זה</button>
            </div>

            <div class="list">
              ${filteredRecords.length ? filteredRecords.map(item => `
                <div class="record-card">
                  <strong>${escapeHtml(item.fullName)}</strong>
                  <span class="badge ${item.status === 'ישן' ? 'sleeping' : 'awake'}">${escapeHtml(item.status)}</span>
                  <div class="record-meta">
                    חדר ${escapeHtml(item.roomNumber)} | ${escapeHtml(item.housingType)} | ${escapeHtml(item.time)}
                  </div>
                </div>
              `).join('') : '<div class="record-card">אין תוצאות ליום זה.</div>'}
            </div>
          </div>
        `;
      }).join('');

      els.historyPanel.innerHTML = html || '<div class="day-card empty-state">אין היסטוריה להצגה.</div>';

      document.querySelectorAll('.copy-by-date-btn').forEach(btn => {
        btn.addEventListener('click', () => copySleepingByDate(btn.dataset.date));
      });
    }

    function rerenderAdminPanels() {
      renderTodayPanel(adminState.todayData);
      renderHistoryPanel(adminState.historyDays);
    }

    async function copyTodaySleeping() {
      clearMessage(els.adminPanelMessage);

      try {
        const response = await fetch(`${scriptURL}?action=copySleepingToday`);
        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || 'לא ניתן להעתיק את הרשימה.');
        }

        await navigator.clipboard.writeText(result.text || 'אין ישנים היום.');
        showMessage(els.adminPanelMessage, 'רשימת הישנים של היום הועתקה בהצלחה', 'success');
        showToast('הרשימה הועתקה');
      } catch (error) {
        showMessage(els.adminPanelMessage, error.message || 'העתקה נכשלה.', 'error');
      }
    }

    async function copySleepingByDate(date) {
      clearMessage(els.adminPanelMessage);

      try {
        const params = new URLSearchParams({
          action: 'copySleepingByDate',
          date
        });

        const response = await fetch(`${scriptURL}?${params.toString()}`);
        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || 'לא ניתן להעתיק את הרשימה.');
        }

        await navigator.clipboard.writeText(result.text || 'אין ישנים ביום זה.');
        showMessage(els.adminPanelMessage, `רשימת הישנים של ${date} הועתקה בהצלחה`, 'success');
        showToast('הרשימה הועתקה');
      } catch (error) {
        showMessage(els.adminPanelMessage, error.message || 'העתקה נכשלה.', 'error');
      }
    }

    async function loadAdminData() {
      clearMessage(els.adminPanelMessage);
      els.todayPanel.innerHTML = '<div class="day-card empty-state">טוען נתונים...</div>';
      els.historyPanel.innerHTML = '<div class="day-card empty-state">טוען היסטוריה...</div>';

      try {
        const [todayResponse, historyResponse] = await Promise.all([
          fetch(`${scriptURL}?action=todayLatest`),
          fetch(`${scriptURL}?action=historyLatest`)
        ]);

        const todayResult = await todayResponse.json();
        const historyResult = await historyResponse.json();

        if (!todayResult.success) {
          throw new Error(todayResult.error || 'טעינת נתוני היום נכשלה.');
        }

        if (!historyResult.success) {
          throw new Error(historyResult.error || 'טעינת ההיסטוריה נכשלה.');
        }

        adminState.todayData = Array.isArray(todayResult.days) && todayResult.days[0]
          ? todayResult.days[0].records || []
          : [];

        adminState.historyDays = Array.isArray(historyResult.days)
          ? historyResult.days
          : [];

        rerenderAdminPanels();
      } catch (error) {
        els.todayPanel.innerHTML = '';
        els.historyPanel.innerHTML = '';
        showMessage(els.adminPanelMessage, error.message || 'אירעה שגיאה בטעינת נתוני המנהל.', 'error');
      }
    }

    function bindEvents() {
      els.fullName.addEventListener('input', saveLocalDetails);
      els.roomNumber.addEventListener('input', saveLocalDetails);
      els.housingType.addEventListener('change', saveLocalDetails);

      els.toggleBtn.addEventListener('click', handleToggle);
      els.saveDetailsBtn.addEventListener('click', saveOnlyDetails);
      els.resetDetailsBtn.addEventListener('click', handleResetDetails);

      els.openAdminLogin.addEventListener('click', function(e) {
        e.preventDefault();
        if (isAdminSession()) {
          showAdminPanelScreen();
        } else {
          showAdminLoginScreen();
        }
      });

      els.backToUser.addEventListener('click', function(e) {
        e.preventDefault();
        showUserScreen();
      });

      els.adminLoginBtn.addEventListener('click', handleAdminLogin);

      els.adminPin.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          handleAdminLogin();
        }
      });

      els.tabTodayBtn.addEventListener('click', function() {
        setActiveAdminTab('today');
      });

      els.tabHistoryBtn.addEventListener('click', function() {
        setActiveAdminTab('history');
      });

      els.refreshAdminBtn.addEventListener('click', loadAdminData);
      els.copyTodayBtn.addEventListener('click', copyTodaySleeping);

      els.adminSearchInput.addEventListener('input', rerenderAdminPanels);
      els.housingFilter.addEventListener('change', rerenderAdminPanels);

      els.logoutAdmin.addEventListener('click', function(e) {
        e.preventDefault();
        setAdminSession(false);
        showUserScreen();
      });

      setInterval(updateToggleUI, 60000); 
    }

    async function init() {
      loadLocalDetails();
      updateToggleUI();
      bindEvents();

      const ready = validateDetails(false);
      if (ready) {
        await syncUserStatusFromServer();
      }

      if (isAdminSession()) {
        showAdminPanelScreen();
      } else {
        showUserScreen();
      }
    }

    init();
  </script>
