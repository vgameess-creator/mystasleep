<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1530" />
  <title>סטטוס שינה</title>
  <style>
    :root {
      --bg: #09101d;
      --bg2: #111a31;
      --card: rgba(19, 28, 49, 0.96);
      --border: rgba(132, 154, 208, 0.16);
      --text: #eef3ff;
      --muted: #aab7d4;
      --blue: #4da3ff;
      --blue2: #2f70ff;
      --orange: #ff9b45;
      --red: #ff5d6d;
      --green: #41d69e;
      --chip: rgba(255,255,255,0.06);
      --shadow: 0 14px 42px rgba(0,0,0,0.36);
      --radius: 22px;
      --radius-sm: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top right, rgba(77,163,255,0.12), transparent 26%),
                  radial-gradient(circle at top left, rgba(255,155,69,0.08), transparent 22%),
                  linear-gradient(180deg, #09101d 0%, #101933 100%);
      color: var(--text);
    }

    body { padding: calc(12px + var(--safe-top)) 12px calc(28px + var(--safe-bottom)); display: flex; justify-content: center; }
    .app { width: 100%; max-width: 760px; }
    
    .card { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 18px; margin-top: 14px; backdrop-filter: blur(10px); }
    .hero { position: sticky; top: 0; z-index: 5; padding-top: 18px; padding-bottom: 18px; background: rgba(15, 23, 44, 0.88); backdrop-filter: blur(14px); }
    h1, h2, h3, p { margin-top: 0; }
    .title { margin-bottom: 6px; font-size: 1.7rem; }
    .subtitle { color: var(--muted); line-height: 1.5; margin-bottom: 0; font-size: 0.95rem; }
    .grid { display: grid; gap: 12px; }
    .grid.two { grid-template-columns: 1fr; }
    label { display: block; margin-bottom: 8px; font-weight: 700; color: #dce6ff; font-size: 0.95rem; }
    input, select { width: 100%; border-radius: 16px; border: 1px solid rgba(132, 154, 208, 0.20); background: rgba(255,255,255,0.04); color: var(--text); padding: 15px 14px; font-size: 1rem; outline: none; transition: 0.2s ease; }
    input::placeholder { color: #8da1c8; }
    input:focus, select:focus { border-color: rgba(77,163,255,0.8); box-shadow: 0 0 0 4px rgba(77,163,255,0.12); }
    select option { color: #000; }
    
    .info-box { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08); color: var(--muted); border-radius: 16px; padding: 14px 16px; line-height: 1.6; margin-top: 14px; }
    .info-box strong { color: var(--text); }
    .actions { display: grid; gap: 10px; margin-top: 14px; }
    button { border: none; cursor: pointer; color: #fff; font-weight: 700; transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease; }
    button:active { transform: scale(0.985); }
    button[disabled] { opacity: 0.7; cursor: wait; }
    
    .toggle-btn { width: 100%; min-height: 72px; border-radius: 22px; padding: 18px; font-size: 1.08rem; }
    .state-awake { background: linear-gradient(135deg, var(--blue), var(--blue2)); }
    .state-sleeping { background: linear-gradient(135deg, var(--orange), var(--red)); }
    .secondary-btn { width: 100%; border-radius: 18px; padding: 14px; font-size: 1rem; background: linear-gradient(135deg, #1c2949, #2f3e66); border: 1px solid rgba(150,170,230,0.18); }
    .ghost-btn { width: 100%; border-radius: 16px; padding: 13px; font-size: 0.95rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
    .danger-btn { width: 100%; border-radius: 16px; padding: 13px; font-size: 0.95rem; background: rgba(255,93,109,0.12); border: 1px solid rgba(255,93,109,0.28); color: #ffc4cd; }
    
    .message { display: none; margin-top: 12px; padding: 13px 14px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; }
